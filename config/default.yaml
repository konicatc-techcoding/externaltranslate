server:
  host: 127.0.0.1
  port: 8765

gemini:
  model: gemini-3.5-live-translate-preview
  target_language_code: zh-Hant
  echo_target_language: true
  session_rotation_seconds: 480

caption:
  max_payload_length: 4096
  chars_per_line: 20
  max_lines: 2
  font: jhenghei
  size: 48
  weight: normal
  color: "#FFFFFF"
  # Outline off by default; turn it on when captions sit over bright video.
  outline_width: 0
  outline_color: "#000000"
  shadow: false
  background_color: "#000000"
  background_opacity: 0.5
  padding: 12
  radius: 8
  align: left
  scroll: true
  scroll_ms: 250

audio:
  source_kind: input_device
  # The index is resolved from the name at every start: an index is a position
  # in an enumeration, so the same number means different hardware after a
  # replug or on another machine. Only the name travels.
  device_index: null
  device_name: null
  device_host_api: null
  loopback_endpoint_index: null
  loopback_endpoint_name: null
  channel: 1
  target_sample_rate: 16000
  chunk_duration_ms: 100
  raw_queue_capacity: 32
  pcm_queue_capacity: 50

features:
  transcript_persistence: false
  lan_access: false
  vmix_output: false
