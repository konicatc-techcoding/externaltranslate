server:
  host: 127.0.0.1
  port: 8765

gemini:
  model: gemini-3.5-live-translate-preview
  target_language_code: zh-Hant
  echo_target_language: true
  session_rotation_seconds: 480

caption:
  max_payload_length: 4096
  chars_per_line: 20
  max_lines: 2
  # A sentence ending with less than 4 full-width characters of room left
  # starts the next one on a new line.
  sentence_breaks: true
  font: jhenghei
  size: 48
  weight: normal
  color: "#FFFFFF"
  # Outline off by default; turn it on when captions sit over bright video.
  outline_width: 0
  outline_color: "#000000"
  shadow: false
  background_color: "#000000"
  background_opacity: 0.5
  padding: 12
  radius: 8
  align: left
  scroll: true
  scroll_ms: 250

audio:
  source_kind: input_device
  # The index is resolved from the name at every start: an index is a position
  # in an enumeration, so the same number means different hardware after a
  # replug or on another machine. Only the name travels.
  device_index: null
  device_name: null
  device_host_api: null
  loopback_endpoint_index: null
  loopback_endpoint_name: null
  channel: 1
  target_sample_rate: 16000
  chunk_duration_ms: 100
  raw_queue_capacity: 32
  pcm_queue_capacity: 50

vmix:
  # vMix Web API. `host` is a bare host or IP — never a URL, because a scheme
  # or path in a settings file hands over the whole endpoint. vMix may run on
  # another machine; the API is plain HTTP, so captions then cross the LAN
  # unencrypted and the control page says so.
  host: 127.0.0.1
  port: 8088
  # The input is remembered by GUID, not by number: numbers shift when inputs
  # are added or removed, and SetText would then quietly write to another one.
  input_guid: null
  input_name: null
  # One GT Title text field per caption line. This app is the source of the
  # spec — build the title to match these names.
  fields:
    - Line1.Text
    - Line2.Text
  min_interval_ms: 200
  timeout_ms: 1000

ui:
  # Panels folded away in the control page. Kept here rather than in browser
  # storage so it survives a reload and moves with the setup.
  collapsed:
    - prerequisites
    - credentials

features:
  transcript_persistence: false
  lan_access: false
  vmix_output: false
