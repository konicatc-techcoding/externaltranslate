[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "externaltranslate"
version = "0.0.1"
description = "Windows real-time translated captions for web overlays and vMix"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "numpy>=2,<3",
  "pyaudiowpatch>=0.2.12.8,<0.3",
  "PyYAML>=6.0.2,<7",
  "sounddevice>=0.5.5,<0.6",
  "soxr>=1,<2",
]

[dependency-groups]
dev = [
  "mypy>=1.15,<2",
  "pytest>=8.3,<9",
  "ruff>=0.11,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
externaltranslate-audio-devices = "backend.app.cli.audio_devices:main"
externaltranslate-audio-smoke = "backend.app.cli.audio_smoke:main"
externaltranslate-loopback-devices = "backend.app.cli.loopback_devices:main"
externaltranslate-loopback-smoke = "backend.app.cli.loopback_smoke:main"
externaltranslate-prerequisites = "backend.app.cli.prerequisites:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["backend.app"]
